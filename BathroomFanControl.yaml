alias: Bathroom fan control
description: ''
mode: restart
triggers:
  - trigger: state
    entity_id: sensor.humidity_sensor_humidity
  - trigger: state
    entity_id:
      - input_number.fan_quiet_speed
      - input_number.fan_normal_speed
      - input_number.fan_high_speed
      - input_number.bathroom_high_humidity
      - input_number.bathroom_resume_humidity
  - trigger: time
    at: input_datetime.quiet_time_start
  - trigger: time
    at: input_datetime.quiet_time_end
  - trigger: homeassistant
    event: start

variables:
  # --- settings, all from helpers ---
  quiet_speed: "{{ states('input_number.fan_quiet_speed') | float(1) | int }}"
  normal_speed: "{{ states('input_number.fan_normal_speed') | float(2) | int }}"
  high_speed: "{{ states('input_number.fan_high_speed') | float(4) | int }}"
  high_humidity: "{{ states('input_number.bathroom_high_humidity') | float(75) }}"
  resume_humidity: "{{ states('input_number.bathroom_resume_humidity') | float(70) }}"
  quiet_start: "{{ states('input_datetime.quiet_time_start') }}"
  quiet_end: "{{ states('input_datetime.quiet_time_end') }}"
  # --- calculations ---
  humidity: "{{ states('sensor.humidity_sensor_humidity') | float(none) }}"
  now_time: "{{ now().strftime('%H:%M:%S') }}"
  is_quiet: "{{ now_time >= quiet_start or now_time < quiet_end }}"
  base_speed: "{{ quiet_speed if is_quiet else normal_speed }}"
  currently_high: "{{ is_state('light.enervent_light_' ~ high_speed, 'on') }}"
  target_speed: >
    {% if humidity > high_humidity %}
      {{ high_speed }}
    {% elif humidity < resume_humidity %}
      {{ base_speed }}
    {% elif currently_high %}
      {{ high_speed }}
    {% else %}
      {{ base_speed }}
    {% endif %}

conditions:
  - condition: template
    value_template: "{{ humidity is not none }}"

actions:
  - action: light.turn_on
    metadata: {}
    target:
      entity_id: "light.enervent_light_{{ target_speed | int }}"
    data: {}
